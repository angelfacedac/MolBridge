# 相对路径以本文件所在目录为基准。标签沿用原 CSV 的整数编号。
dataset: Deng
data_root: data
output_root: runs
device: auto
datasets:
  Deng: {num_classes: 65, folds: [0, 1, 2, 3, 4], test_splits: [test]}
  Ryu: {num_classes: 86, folds: [0, 1, 2, 3, 4], test_splits: [test]}
  inductive: {num_classes: 86, folds: [0, 1, 2], test_splits: [s1, s2]}

model:
  hidden_dim: 256
  classifier_dim: 256
  ffn_dim: 2048
  num_layers: 3
  num_heads: 4
  dropout: 0.1

training:
  seed: 42
  # 保留完整分子后，一个 batch 的显存取决于其中最长药对。
  batch_size: 32
  num_workers: 0
  lr: 0.0005
  weight_decay: 0.01
  epochs: 500
  patience: 50
